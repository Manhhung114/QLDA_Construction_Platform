name: CI

on:
  push:
    branches: [main, build/v1-12-modules]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/qlda_test.db
      UPLOAD_DIR: /tmp/qlda_uploads
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: TestPass123!
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: PYTHONPATH=backend pytest -q backend/tests/test_smoke.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
